# This is a basic workflow to help you get started with Actions

name: Run Arxiv Papers Daily

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  # Triggers the workflow on push or pull request events but only for the main branch
#   push:
#     branches:
#     - main

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
concurrency:
  group: arxiv-daily
  cancel-in-progress: true

jobs:
  # This workflow contains a single job called "build"
  build:
    name: update
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python Env
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily arxiv
        env:
          ARXIV_MAX_RESULTS_PER_KEYWORD: "100"
          ARXIV_PAGE_SIZE: "100"
          ARXIV_DELAY_SECONDS: "10"
          ARXIV_CLIENT_RETRIES: "2"
          ARXIV_KEYWORD_RETRIES: "4"
          ARXIV_BACKOFF_SECONDS: "60"
          ARXIV_MAX_BACKOFF_SECONDS: "900"
        run: |
          python daily_arxiv.py

      - name: Push new markdown file
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Github Action Automatic Update Arxiv Papers"
          files: index.html arxiv-daily.json
          rebase: "true"
          name: "GitHub Action Bot"
          email: "action-bot-for-lartpang@github.com"
