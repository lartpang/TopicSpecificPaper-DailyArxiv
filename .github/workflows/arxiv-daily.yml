name: Update Daily Preprints

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      force:
        description: Fetch again even if today's sources already succeeded
        required: false
        default: false
        type: boolean
      preprints_backfill_days:
        description: OAI-PMH history window in days (0 runs the normal daily RSS update)
        required: false
        default: 0
        type: number
  schedule:
    # Primary run after arXiv's daily API refresh; fallback protects against a dropped cron event.
    # The state file prevents the fallback from querying sources again after a successful primary run.
    - cron: "17 6 * * *"
    - cron: "47 16 * * *"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
concurrency:
  group: daily-preprints
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: update
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python Env
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update paper metadata
        env:
          FORCE_FETCH: ${{ github.event.inputs.force || 'false' }}
          PREPRINTS_BACKFILL_DAYS: ${{ github.event.inputs.preprints_backfill_days || '0' }}
          ARXIV_MAX_RESULTS_PER_KEYWORD: "100"
          ARXIV_PAGE_SIZE: "100"
          ARXIV_DELAY_SECONDS: "4"
          ARXIV_CLIENT_RETRIES: "1"
          ARXIV_KEYWORD_RETRIES: "2"
          ARXIV_BACKOFF_SECONDS: "30"
          ARXIV_MAX_BACKOFF_SECONDS: "120"
          PREPRINTS_OAI_DELAY_SECONDS: "1"
          PREPRINTS_OAI_MAX_PAGES: "5000"
          PAPER_RETENTION_DAYS: "180"
          PREPRINT_RETENTION_DAYS: "1826"
          JSON_MAX_SIZE_MIB: "45"
        run: |
          python daily_arxiv.py

      - name: Commit updated metadata
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action-bot-for-lartpang@github.com"
          git add index.html arxiv-daily.json .tracker-state.json
          if git diff --cached --quiet; then
            echo "No files changed."
            exit 0
          fi
          git commit -m "Update daily preprints"
          git pull --rebase origin main
          git push origin HEAD:main
