name: Update Daily Preprints

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      force:
        description: Fetch again even if today's sources already succeeded
        required: false
        default: false
        type: boolean
      preprints_backfill_days:
        description: Preprints.org metadata history window in days (1826 for five years; 0 for daily sync)
        required: false
        default: 0
        type: number
  schedule:
    # Primary run after arXiv's daily API refresh; fallback protects against a dropped cron event.
    # The state file prevents the fallback from querying sources again after a successful primary run.
    - cron: "17 6 * * *"
    - cron: "47 16 * * *"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
concurrency:
  group: daily-preprints
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    name: update
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python Env
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: python -m pip install --requirement requirements.txt

      - name: Update paper metadata
        env:
          FORCE_FETCH: ${{ github.event.inputs.force || 'false' }}
          PREPRINTS_BACKFILL_DAYS: ${{ github.event.inputs.preprints_backfill_days || '0' }}
          PREPRINTS_LOOKBACK_DAYS: "3"
          PREPRINTS_METADATA_DELAY_SECONDS: "1"
          PREPRINTS_METADATA_MAX_PAGES: "5000"
          PREPRINTS_WINDOW_RETRIES: "3"
          PREPRINTS_WINDOW_BACKOFF_SECONDS: "15"
          HTTP_MAX_RESPONSE_MIB: "64"
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ARXIV_MAX_RESULTS_PER_KEYWORD: "100"
          ARXIV_PAGE_SIZE: "100"
          ARXIV_DELAY_SECONDS: "4"
          ARXIV_CLIENT_RETRIES: "1"
          ARXIV_KEYWORD_RETRIES: "2"
          ARXIV_BACKOFF_SECONDS: "30"
          ARXIV_MAX_BACKOFF_SECONDS: "120"
          PAPER_RETENTION_DAYS: "180"
          PREPRINT_RETENTION_DAYS: "1826"
          JSON_MAX_SIZE_MIB: "75"
        run: |
          python daily_arxiv.py

      - name: Commit updated metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action-bot-for-lartpang@github.com"
          git add index.html data .tracker-state.json
          if git diff --cached --quiet; then
            echo "No files changed."
            exit 0
          fi
          git commit -m "Update daily preprints"
          auth_helper='!f() { if [ "$1" = get ]; then echo "username=x-access-token"; echo "password=$GH_TOKEN"; fi; }; f'
          git -c credential.helper= -c credential.helper="$auth_helper" pull --rebase origin main
          git -c credential.helper= -c credential.helper="$auth_helper" push origin HEAD:main
